<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GHF Travel</title>
    <link rel="stylesheet" href="./travel_recommendation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        h2 {
            padding: 5px 20px
        }
        h3 {
            padding: 1px 20px;
            font-family: Lucida;
            color: black;
        }
        body {
            background-image: url('Travel_image.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: auto;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img
                src="https://images.unsplash.com/vector-1739799630266-d53972ed89a2?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Logo"
                width="100"
                height="50"
            />
        <h3>GHF Travel</h3></div>
        <ul>
            <li><a href="#" onclick="history.back(); return false;">Home</a></li>
        </ul>
    </nav>
    <br>
    <div class="contact-box">
        <h2>Contact Us</h2><br>
        <form>
            <label for="name"><h3>Name</h3></label><br>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email"><h3>Email</h3></label><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message"><h3>Your message</h3></label><br>
            <textarea id="message" name="message" rows="5" cols="60" required></textarea><br><br>
            <button type="submit">Submit</button>
        </form>
</body>
</html>
