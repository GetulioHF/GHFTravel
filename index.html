<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GHF Travel</title>
    <link rel="stylesheet" href="./travel_recommendation.css">
    <style>
        h1 {
            display: inline-block;          /* Makes the border fit the text */
            padding: 10px 20px;             /* Space around the text */
            border: 2px solid #333;         /* Border around the text */
            border-color: red;
            border-radius: 20px;            /* Rounded corners */
            background-color: transparent;  /* Optional background */
            font-family: Arial, sans-serif;
            color: red;
            margin-bottom: 15px;            /* Space between phrases */
        }
        h3 {
            font-family: Lucida;
            color: black;
        }
        h5 {
            font-family: Arial;
            color: black;
        }
        body {
            background-image: url('Travel_image.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: auto;
        }
        /* Center text horizontally and vertically NÃO PRECISO DELE DEPOIS */
        .center-text {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            font-size: 24px;
            background-color: #f0f0f0;
        }
        /* Absolute positioning */
        .absolute-text {
            position: absolute;
            top: 200px;
            left: 100px;
            font-size: 25px;
            color: white;
        }
        /* This was included by me (Getulio) */
        .absolute-text2 {
            position: absolute;
            top: 200px;
            left: 800px;
            font-size: 25px;
            color: red;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <img
              src="https://images.unsplash.com/vector-1739799630266-d53972ed89a2?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
              alt="Logo"
              width="100"
              height="50"
            /><h3>GHF Travel</h3></div>
        <ul>
        <li><a id="Home">Home </a></li>
        <li><a id="About">About Us </a></li>
        <li><a id="Contact">Contact Us </a></li>
        <li><input type="text" id="destinationInput" placeholder="Enter a destination">  </li>
        <li><button id='btnSearch'>Search</button>
        <li><button id='btnClear'>Clear</button>
        </li>
        </ul>
    </nav>
    <div class="container">
        <div class="absolute-text">
            <h1><p>FIND YOUR</p><p>SPECIAL PLACE</p></h1>
            <h5>Seek out new experiences and cherish them <p>in your memory for a lifetime</p></h5> 
        </div>
    </div>
    <div class="searchCountry">
        <div id="result"></div>
    </div>
    <script src="./travel_recommendation.js"></script>
</body>

</html>
